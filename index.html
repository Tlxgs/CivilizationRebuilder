<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>文明重建者</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 防止 Vue 挂载前闪现未编译模板 */
        [v-cloak] { display: none; }
        /* 右下角 GitHub 链接样式 */
        .github-corner {
            position: fixed;
            bottom: 4px;
            right: 4px;
            z-index: 2000;
            background: var(--bg-card);
            border-radius: 40px;
            box-shadow: 0 2px 8px var(--shadow-lg);
            backdrop-filter: blur(4px);
            transition: transform 0.2s ease, background 0.2s;
            border: 1px solid var(--border-card);
        }
        .github-corner:hover {
            transform: scale(1.05);
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }
        .github-corner a {
            display: flex;
            align-items: center;
            gap: 0px;
            padding: 2px 4px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .github-corner svg {
            width: 20px;
            height: 20px;
            fill: var(--accent);
        }
        .github-corner span {
            letter-spacing: 0.3px;
        }
        /* 移动端稍微调整位置避免遮挡 */
        @media (max-width: 2560px) {
            .github-corner a {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            .github-corner svg {
                width: 18px;
                height: 18px;
            }
        }
        /* 确保深色主题下图标颜色依然醒目 */
        body.dark-theme .github-corner svg {
            fill: #58a6ff;
        }
    </style>
</head>
<body>
    <!-- Vue 应用挂载点（全部界面由 ui/*.js 中的 Vue 组件渲染） -->
    <div id="app" v-cloak></div>

    <!-- 右下角 GitHub 链接 (纯文本超链接 + 图标) -->
    <div class="github-corner">
        <a href="https://github.com/Tlxgs/CivilizationRebuilder" target="_blank" rel="noopener noreferrer" aria-label="GitHub仓库">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.302 3.438 9.8 8.205 11.387.6.113.82-.26.82-.58 0-.287-.01-1.05-.015-2.06-3.338.726-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.082-.73.082-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.776.418-1.306.762-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.468-2.38 1.235-3.22-.123-.3-.535-1.52.117-3.16 0 0 1.008-.322 3.3 1.23.96-.267 1.98-.4 3-.405 1.02.005 2.04.138 3 .405 2.29-1.552 3.297-1.23 3.297-1.23.653 1.64.24 2.86.118 3.16.768.84 1.233 1.91 1.233 3.22 0 4.61-2.804 5.62-5.476 5.92.43.37.823 1.1.823 2.22 0 1.602-.015 2.894-.015 3.287 0 .322.216.698.83.578C20.565 21.795 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <span>GitHub</span>
        </a>
    </div>

    <!-- 框架：Vue 3（本地全局构建包，含模板编译器；无需构建步骤，file:// 与 GitHub Pages 均可直接运行） -->
    <script src="vendor/vue.global.prod.js"></script>

    <!-- 基础数据和工具 -->
    <script src="config/resourcesConfig.js"></script>
    <script src="config/localResourceConfig.js"></script>
    <script src="config/buildingsConfig.js"></script>
    <script src="config/achievementConfig.js"></script>
    <script src="config/techsConfig.js"></script>
    <script src="config/eventsConfig.js"></script>
    <script src="config/upgradesConfig.js"></script>
    <script src="config/policiesConfig.js"></script>
    <script src="config/permanentConfig.js"></script>

    <!-- 游戏引擎（与 UI 解耦，逻辑保持不变） -->
    <script src="effectsManager.js"></script>
    <script src="recourcesManager.js"></script>
    <script src="logic.js"></script>
    <script src="data.js"></script>
    <script src="utils.js"></script>
    <script src="core.js"></script>
    <script src="queue.js"></script>
    <script src="formulas.js"></script>
    <script src="tradeEngine.js"></script>
    <script src="gameloop.js"></script>
    <script src="saveLoad.js"></script>
    <script src="debug.js"></script>
    <script src="production.js"></script>
    <script src="eventEffects.js"></script>
    <script src="changeLog.js"></script>

    <!-- UI 模块（Vue 组件；common 最先加载，index 最后装配） -->
    <script src="ui/common.js"></script>
    <script src="ui/tooltip.js"></script>
    <script src="ui/population.js"></script>
    <script src="ui/resourceBar.js"></script>
    <script src="ui/actions.js"></script>
    <script src="ui/tabs.js"></script>
    <script src="ui/buildings.js"></script>
    <script src="ui/tech.js"></script>
    <script src="ui/policy.js"></script>
    <script src="ui/permanent.js"></script>
    <script src="ui/reset.js"></script>
    <script src="ui/trade.js"></script>
    <script src="ui/crystal.js"></script>
    <script src="ui/changelog.js"></script>
    <script src="ui/achievements.js"></script>
    <script src="ui/log.js"></script>
    <script src="ui/queue.js"></script>
    <script src="ui/importModal.js"></script>
    <script src="ui/app.js"></script>
    <script src="ui/index.js"></script>   <!-- 装配入口 -->

    <!-- 主入口 -->
    <script src="main.js"></script>
</body>
</html>
